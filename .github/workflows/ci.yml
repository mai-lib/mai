name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # x86-64 Linux is the platform the thesis targeted; the others are
    # being tried out and are allowed to fail for now.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: ubuntu-24.04-arm
            experimental: true
          - os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bison m4 libreadline-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison m4 readline
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix m4)/bin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix readline)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix readline)/lib" >> "$GITHUB_ENV"

      - name: Build (portable, no -march=native)
        run: make build CTUNE= CFLAGS="$CPPFLAGS"

      - name: Smoke tests
        run: ./tests/run.sh build/main
