name: Docs

# Builds the documentation site from docs/ with mkdocs.
#
# - Pushes to main publish the site to the gh-pages branch, served at
#   https://mai-lib.github.io/mai/
# - Pull requests that touch the docs get a preview at
#   https://mai-lib.github.io/mai/pr-preview/pr-<number>/ and a comment with
#   the link. The preview is removed when the pull request closes.
#
# Pull requests from forks are built but not previewed, because their token
# cannot push to gh-pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/mkdocs_hooks.py'
      - '.github/docs-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/mkdocs_hooks.py'
      - '.github/docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: '3.12'

      - name: Build site
        if: github.event.action != 'closed'
        run: |
          pip install -r .github/docs-requirements.txt
          mkdocs build
          touch site/.nojekyll

      - name: Publish site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/

      - name: Publish or remove preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
